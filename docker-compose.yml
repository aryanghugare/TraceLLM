x-python-env: &python-env
  MONGODB_URI: mongodb://mongo:27017/tracellm
  REDIS_URL: redis://redis:6379
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  # ---------- Python service (default) ----------
  py-api:
    build: ./python-service
    ports:
      - "8000:8000"
    environment: *python-env
    depends_on:
      - mongo
      - redis

  py-worker:
    build: ./python-service
    command: arq app.worker.WorkerSettings
    environment: *python-env
    healthcheck:
      disable: true
    depends_on:
      - mongo
      - redis

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: ${VITE_API_PROXY:-http://py-api:8000}
    depends_on:
      - py-api

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - py-api
      - py-worker

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tracellm.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ---------- Data stores ----------
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ---------- Original Node API (opt-in: `docker compose --profile node up`) ----------
  # Note: this expects a server.js entrypoint, which is not in the repo yet.
  api:
    profiles: ["node"]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && node server.js"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MONGODB_URI: mongodb://mongo:27017/tracellm
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
