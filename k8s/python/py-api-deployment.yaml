apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-llm-py-api
  labels:
    app: trace-llm-py-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trace-llm-py-api
  template:
    metadata:
      labels:
        app: trace-llm-py-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: trace-llm-py:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: trace-llm-config
            - secretRef:
                name: trace-llm-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
